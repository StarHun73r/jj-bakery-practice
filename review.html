<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Check</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif; background: #f3f5f7; color: #222; }
    header { position: sticky; top: 0; background: #23272b; color: #fff; padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; z-index: 2; }
    header a { color: #9fd3ff; }
    main { padding: 12px 16px 40px; }
    h2 { margin: 22px 0 8px; font-size: 1.1rem; color: #1d8fc4; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
    .item { background: #fff; border-radius: 10px; overflow: hidden; border: 2px solid transparent; }
    .item.missing { opacity: .55; }
    .pics { display: grid; grid-template-columns: 1fr 1fr; height: 170px; background: #e6eaed; }
    .pics img { width: 100%; height: 170px; object-fit: cover; display: block; cursor: zoom-in; }
    .pics .none { grid-column: 1 / 3; display: flex; align-items: center; justify-content: center; color: #888; }
    .pics.one { grid-template-columns: 1fr; }
    .info { padding: 8px 10px; font-size: .88rem; line-height: 1.35; }
    .name { font-weight: 600; }
    .meta { color: #666; font-size: .8rem; }
    .price { float: right; font-weight: 700; color: #146c43; }
    .price.unknown { color: #b0b0b0; font-weight: 400; }
    .lbl { font-size: .7rem; color: #666; display: grid; grid-template-columns: 1fr 1fr; text-align: center; padding-top: 2px; }
    body.only-missing .item:not(.missing) { display: none; }
    body.only-photos .item.missing { display: none; }
    #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 5; cursor: zoom-out; }
    #zoom img { max-width: 95vw; max-height: 95vh; }
  </style>
  <link rel="stylesheet" href="css/lock.css?v=63475cd5">
</head>
<body>
  <!-- Lock screen: arrow code to get in (js/lock.js) -->
  <div class="lock" id="lock" role="dialog" aria-label="Locked">
    <div class="lock-box">
      <h1>JJ Bakery</h1>
      <p>Enter the 8-arrow code to continue.</p>
      <div class="lock-dots" id="lock-dots"></div>
      <div class="lock-pad">
        <button data-dir="up" aria-label="Up">&#9650;</button>
        <button data-dir="left" aria-label="Left">&#9664;</button>
        <button data-dir="down" aria-label="Down">&#9660;</button>
        <button data-dir="right" aria-label="Right">&#9654;</button>
        <button class="lock-clear" id="lock-clear" aria-label="Clear">Clear</button>
      </div>
    </div>
  </div>
  <script src="js/accounts.js?v=96422171"></script>
  <script src="js/lock.js?v=48f83543"></script>
  <header>
    <strong>Photo check</strong>
    <span id="summary"></span>
    <label><input type="radio" name="f" value="" checked> All</label>
    <label><input type="radio" name="f" value="only-photos"> Has photo</label>
    <label><input type="radio" name="f" value="only-missing"> Missing photo</label>
    <a href="index.html">← Back to register</a>
  </header>
  <main id="main"></main>
  <div id="zoom"><img alt=""></div>

  <script src="js/menu-data.js?v=476891c9"></script>
  <script src="js/photos-manifest.js?v=c4c7ffa5"></script>
  <script src="js/photo-sources.js?v=2d27d031"></script>
  <script>
    var PHOTOS = window.PHOTO_FILES || {}, SOURCES = window.PHOTO_SOURCES || {};
    var main = document.getElementById("main"), total = 0, have = 0, priced = 0;
    var esc = function (s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; };

    // Where the button sits: pages of 5 x 6, filled row by row (same as the register)
    function pos(i, n) {
      var slot = i % 30;
      return (n > 30 ? "page " + (Math.floor(i / 30) + 1) + ", " : "") + "row " + (Math.floor(slot / 5) + 1) + ", col " + (slot % 5 + 1);
    }

    (function walk(nodes, path) {
      var items = nodes.filter(function (n) { return n.type === "item"; });
      if (items.length) {
        var section = document.createElement("section");
        section.innerHTML = "<h2>" + esc(["Top Menu"].concat(path).join(" / ")) + "</h2><div class='grid'></div>";
        main.appendChild(section);
        var grid = section.lastChild;
        nodes.forEach(function (n, i) {
          if (n.type !== "item") return;
          total++;
          var photo = PHOTOS[n.id], src = SOURCES[n.id];
          if (photo) have++;
          if (n.price) priced++;
          var pics = photo
            ? "<div class='pics" + (src ? "" : " one") + "'><img src='" + photo + "'>" + (src ? "<img src='" + src + "'>" : "") + "</div>" +
              (src ? "<div class='lbl'><span>photo used</span><span>original (name plate)</span></div>" : "")
            : "<div class='pics'><div class='none'>no photo yet</div></div>";
          grid.insertAdjacentHTML("beforeend",
            "<div class='item" + (photo ? "" : " missing") + "'>" + pics +
            "<div class='info'><span class='price" + (n.price ? "" : " unknown") + "'>" + (n.price ? "$" + n.price.toFixed(2) : "no price") + "</span>" +
            "<div class='name'>" + esc(n.name) + "</div>" +
            "<div class='meta'>" + pos(i, nodes.length) + " · id: " + esc(n.id) + "</div></div></div>");
        });
      }
      nodes.forEach(function (n) { if (n.type === "folder") walk(n.children, path.concat(n.name)); });
    })(window.MENU_TREE, []);

    document.getElementById("summary").textContent =
      have + " of " + total + " items have photos · " + priced + " have prices";
    document.querySelectorAll("input[name=f]").forEach(function (r) {
      r.onchange = function () {
        document.body.className = r.value;
        // hide folder headings with nothing left to show
        document.querySelectorAll("section").forEach(function (sec) {
          var shown = [].some.call(sec.querySelectorAll(".item"), function (el) { return getComputedStyle(el).display !== "none"; });
          sec.style.display = shown ? "" : "none";
        });
      };
    });
    var zoom = document.getElementById("zoom");
    main.addEventListener("click", function (e) {
      if (e.target.tagName === "IMG") { zoom.firstChild.src = e.target.src; zoom.style.display = "flex"; }
    });
    zoom.onclick = function () { zoom.style.display = "none"; };
  </script>
</body>
</html>
